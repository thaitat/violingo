<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ฝึกไวโอลิน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;700&family=Noto+Music&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2E9DC; --panel:#FBF6EE; --ink:#2B1B14; --muted:#7A6656; --line:#D9C9B4;
  --accent:#B9771A; --ok:#2E8B57; --off:#C0392B; --staff:#3A2A20;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1E1512; --panel:#2A1F1A; --ink:#F3E7D3; --muted:#A8927E; --line:#4A3A30;
    --accent:#E3A640; --ok:#6FCF97; --off:#EF8A7A; --staff:#E8D9C2;
  }
}
:root[data-theme="dark"]{
  --bg:#1E1512; --panel:#2A1F1A; --ink:#F3E7D3; --muted:#A8927E; --line:#4A3A30;
  --accent:#E3A640; --ok:#6FCF97; --off:#EF8A7A; --staff:#E8D9C2;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  -webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 32px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font-size:1.35rem;margin:0;font-weight:700;letter-spacing:.01em}
.ref{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted)}
select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:6px 8px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:4px;margin-bottom:14px}
.tabs button{font:inherit;font-weight:500;border:0;background:transparent;color:var(--muted);
  padding:10px;border-radius:9px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.readout{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 14px 10px;text-align:center}
.note{font-size:4.2rem;line-height:1;font-weight:700;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.note sub{font-size:1.6rem;font-weight:500;color:var(--muted);vertical-align:baseline}
.note.idle{color:var(--line)}
.solfa{font-size:1.9rem;font-weight:700;color:var(--accent);min-height:1.3em;line-height:1.3}
.solfa.idle{color:var(--line)}
.chip b{font-weight:500;margin-left:4px}
.meta{color:var(--muted);font-size:.9rem;min-height:1.3em}
.status{font-weight:700;min-height:1.4em;margin-top:2px}
.status.ok{color:var(--ok)} .status.off{color:var(--off)}
svg{display:block;width:100%;height:auto}

.start{display:block;width:100%;margin:14px 0;font:inherit;font-size:1.05rem;font-weight:700;
  padding:14px;border-radius:12px;border:0;background:var(--accent);color:#fff;cursor:pointer}
.start.running{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:500}
.hold{display:flex;gap:8px;align-items:flex-start;font-size:.9rem;color:var(--muted);margin:-2px 0 4px;line-height:1.5}
.hold input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent)}
.err{color:var(--off);font-size:.9rem;margin:-4px 0 12px;display:none}

.panel{margin-top:14px}
.strings{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.strings button{font:inherit;font-weight:700;font-size:1.05rem;padding:12px 0;border-radius:10px;
  border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.strings button small{display:block;font-weight:400;font-size:.7rem;color:var(--muted)}
.strings button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.strings button.hit{background:var(--accent);color:#fff}
.strings button.hit small{color:#fff}
.row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.ghost{font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);cursor:pointer}
.hint{color:var(--muted);font-size:.85rem;margin:10px 0 0;line-height:1.6}

.staffbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:6px 4px;overflow-x:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{padding:5px 10px;border-radius:999px;border:1px solid var(--line);font-size:.9rem;color:var(--muted);transition:background .12s}
.chip.on{background:var(--ok);border-color:var(--ok);color:#fff}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted);margin-top:8px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){ .chip{transition:none} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ฝึกไวโอลิน</h1>
    <label class="ref">A4 =
      <select id="refSel" aria-label="ความถี่อ้างอิง A4">
        <option value="440">440 Hz</option><option value="441">441 Hz</option>
        <option value="442">442 Hz</option><option value="443">443 Hz</option>
      </select>
    </label>
  </header>

  <div class="tabs" role="tablist">
    <button role="tab" id="tabTune" aria-selected="true">ตั้งสาย</button>
    <button role="tab" id="tabPlay" aria-selected="false">ดูโน้ตที่เล่น</button>
  </div>

  <section class="readout" aria-live="polite">
    <div class="note idle" id="noteName">–</div>
    <div class="solfa idle" id="solfa" hidden></div>
    <div class="meta" id="meta">กดปุ่มเริ่มฟังแล้วสีสายเปล่า</div>
    <svg id="meter" viewBox="0 0 300 150" aria-hidden="true"></svg>
    <div class="status" id="status"></div>
  </section>

  <button class="start" id="startBtn">เริ่มฟังเสียง</button>
  <p class="err" id="err"></p>
  <label class="hold"><input type="checkbox" id="holdChk" checked> ล็อกค่าตอนเสียงดังที่สุด (ไม่อ่านช่วงเสียงที่กำลังจางหาย)</label>

  <!-- Tuner -->
  <section class="panel" id="tunePanel">
    <div class="strings" id="strings"></div>
    <div class="row">
      <button class="ghost" id="playRef">เล่นเสียงอ้างอิง</button>
      <span class="hint" style="margin:0" id="refHint">สายที่เลือก: อัตโนมัติ</span>
    </div>
    <p class="hint">โหมดอัตโนมัติจะเลือกสายที่ใกล้กับเสียงที่สีมากที่สุด ถ้าเข็มอยู่ในแถบสีเขียว (±5 cents) แปลว่าสายตรงแล้ว</p>
  </section>

  <!-- Practice -->
  <section class="panel" id="playPanel" hidden>
    <div class="row" style="margin:0 0 10px">
      <label for="scaleSel" style="font-weight:500">บันไดเสียง</label>
      <select id="scaleSel"></select>
    </div>
    <div class="staffbox"><svg id="staff" viewBox="0 0 360 190" role="img" aria-label="บรรทัด 5 เส้นแสดงโน้ตที่เล่น"></svg></div>
    <div class="chips" id="chips"></div>
    <div class="legend">
      <span><span class="dot" style="background:var(--ok)"></span>อยู่ในบันไดเสียง</span>
      <span><span class="dot" style="background:var(--off)"></span>นอกบันไดเสียง</span>
    </div>
    <p class="hint">โน้ตที่เล่นล่าสุดอยู่ขวาสุด โน้ตก่อนหน้าจะค่อยๆ จางไปทางซ้าย</p>
  </section>
</div>

<script>
(() => {
  // ---------- Music helpers ----------
  const LETTERS = ['C','D','E','F','G','A','B'];
  const SHARP = [[0,0],[0,1],[1,0],[1,1],[2,0],[3,0],[3,1],[4,0],[4,1],[5,0],[5,1],[6,0]];
  const FLAT  = [[0,0],[1,-1],[1,0],[2,-1],[2,0],[3,0],[4,-1],[4,0],[5,-1],[5,0],[6,-1],[6,0]];
  const ACC = {'-1':'♭','0':'','1':'♯'};
  const SOLF = ['โด','เร','มี','ฟา','ซอล','ลา','ที'];
  const solfa = sp => SOLF[sp.li]+ACC[sp.acc];
  const MAJOR=[0,2,4,5,7,9,11], MINOR=[0,2,3,5,7,8,10];
  const SCALES = [
    {id:'none', name:'ไม่เลือก (แสดงทุกโน้ต)', tonic:0, iv:null, flats:false},
    {id:'C',  name:'C เมเจอร์',  tonic:0,  iv:MAJOR, flats:false},
    {id:'G',  name:'G เมเจอร์',  tonic:7,  iv:MAJOR, flats:false},
    {id:'D',  name:'D เมเจอร์',  tonic:2,  iv:MAJOR, flats:false},
    {id:'A',  name:'A เมเจอร์',  tonic:9,  iv:MAJOR, flats:false},
    {id:'E',  name:'E เมเจอร์',  tonic:4,  iv:MAJOR, flats:false},
    {id:'F',  name:'F เมเจอร์',  tonic:5,  iv:MAJOR, flats:true},
    {id:'Bb', name:'B♭ เมเจอร์', tonic:10, iv:MAJOR, flats:true},
    {id:'Eb', name:'E♭ เมเจอร์', tonic:3,  iv:MAJOR, flats:true},
    {id:'Am', name:'A ไมเนอร์',  tonic:9,  iv:MINOR, flats:false},
    {id:'Em', name:'E ไมเนอร์',  tonic:4,  iv:MINOR, flats:false},
    {id:'Dm', name:'D ไมเนอร์',  tonic:2,  iv:MINOR, flats:true},
    {id:'Gm', name:'G ไมเนอร์',  tonic:7,  iv:MINOR, flats:true},
  ];
  const STRINGS = [{n:'G',m:55},{n:'D',m:62},{n:'A',m:69},{n:'E',m:76}];

  let A4 = 440;
  const midiToFreq = m => A4 * Math.pow(2,(m-69)/12);
  const freqToMidiF = f => 12*Math.log2(f/A4) + 69;
  const pc = m => ((m%12)+12)%12;

  function spell(m, flats){
    const [li,acc] = (flats?FLAT:SHARP)[pc(m)];
    const oct = Math.floor(m/12)-1;
    return {letter:LETTERS[li], li, acc, oct, dia: oct*7+li};
  }

  // ---------- State ----------
  let mode = 'tune';
  let selString = -1; // -1 = auto
  let scale = SCALES[2];
  let history = []; // stable notes {m}
  let cand = null, candSince = 0, lastPushed = null, lastHeard = 0;

  // ---------- DOM ----------
  const $ = id => document.getElementById(id);
  const solfaEl=$('solfa'), noteName=$('noteName'), meta=$('meta'), status=$('status'), meter=$('meter');
  const startBtn=$('startBtn'), err=$('err');

  // Tabs
  function setMode(m){
    mode=m;
    $('tabTune').setAttribute('aria-selected', m==='tune');
    $('tabPlay').setAttribute('aria-selected', m==='play');
    $('tunePanel').hidden = m!=='tune';
    $('playPanel').hidden = m!=='play';
    solfaEl.hidden = m!=='play';
    if(!running) meta.textContent = m==='tune' ? 'กดปุ่มเริ่มฟังแล้วสีสายเปล่า' : 'กดปุ่มเริ่มฟังแล้วเล่นโน้ตทีละตัว';
  }
  $('tabTune').onclick=()=>setMode('tune');
  $('tabPlay').onclick=()=>setMode('play');

  $('refSel').onchange=e=>{A4=+e.target.value; buildStrings();};

  // Strings
  function buildStrings(){
    const box=$('strings'); box.innerHTML='';
    const mk=(label,sub,idx)=>{
      const b=document.createElement('button');
      b.innerHTML=label+'<small>'+sub+'</small>';
      b.setAttribute('aria-pressed', selString===idx);
      b.dataset.idx=idx;
      b.onclick=()=>{selString=idx; buildStrings();
        $('refHint').textContent='สายที่เลือก: '+(idx<0?'อัตโนมัติ':'สาย '+STRINGS[idx].n);};
      box.appendChild(b);
    };
    mk('อัตโน','มัติ',-1);
    STRINGS.forEach((s,i)=>mk(s.n, midiToFreq(s.m).toFixed(1)+' Hz', i));
  }
  buildStrings();

  // Scale select
  const scaleSel=$('scaleSel');
  SCALES.forEach(s=>{const o=document.createElement('option');o.value=s.id;o.textContent=s.name;scaleSel.appendChild(o);});
  scaleSel.value=scale.id;
  scaleSel.onchange=()=>{scale=SCALES.find(s=>s.id===scaleSel.value); history=[]; buildChips(); drawStaff(null);};

  function inScale(m){ if(!scale.iv) return true; return scale.iv.includes(pc(m-scale.tonic)); }
  function buildChips(){
    const box=$('chips'); box.innerHTML='';
    if(!scale.iv) return;
    scale.iv.forEach(iv=>{
      const m=60+scale.tonic+iv, s=spell(m, scale.flats);
      const c=document.createElement('span'); c.className='chip'; c.dataset.pc=pc(m);
      c.innerHTML=s.letter+ACC[s.acc]+'<b>'+solfa(s)+'</b>'; box.appendChild(c);
    });
  }
  buildChips();

  // ---------- Meter ----------
  const NS='http://www.w3.org/2000/svg';
  const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||meter).appendChild(e);return e;};
  const CX=150, CY=140, R=118;
  const pt=(deg,r)=>{const a=(deg-90)*Math.PI/180;return [CX+r*Math.cos(a), CY+r*Math.sin(a)];};
  function arc(d0,d1,r){const [x0,y0]=pt(d0,r),[x1,y1]=pt(d1,r);return `M${x0} ${y0} A${r} ${r} 0 0 1 ${x1} ${y1}`;}
  el('path',{d:arc(-60,60,R),fill:'none',stroke:'var(--line)','stroke-width':10,'stroke-linecap':'round'});
  el('path',{d:arc(-6,6,R),fill:'none',stroke:'var(--ok)','stroke-width':10});
  [-50,-25,0,25,50].forEach(c=>{
    const d=c*1.2, [x0,y0]=pt(d,R-12), [x1,y1]=pt(d,R-22), [tx,ty]=pt(d,R-36);
    el('line',{x1:x0,y1:y0,x2:x1,y2:y1,stroke:'var(--muted)','stroke-width':2});
    const t=el('text',{x:tx,y:ty+4,'text-anchor':'middle','font-size':11,fill:'var(--muted)'});
    t.textContent=(c>0?'+':'')+c;
  });
  const lbl=(x,txt)=>{const t=el('text',{x,y:CY,'text-anchor':'middle','font-size':12,fill:'var(--muted)'});t.textContent=txt;};
  lbl(40,'ต่ำไป'); lbl(260,'สูงไป');
  const needle=el('line',{x1:CX,y1:CY,x2:CX,y2:CY-R+18,stroke:'var(--ink)','stroke-width':3,'stroke-linecap':'round',opacity:.25});
  el('circle',{cx:CX,cy:CY,r:6,fill:'var(--ink)'});
  let shownCents=0;
  function setNeedle(c, active){
    const target=Math.max(-50,Math.min(50,c));
    shownCents += (target-shownCents)*0.35;
    needle.setAttribute('transform',`rotate(${shownCents*1.2} ${CX} ${CY})`);
    needle.setAttribute('opacity', active?1:.25);
    needle.setAttribute('stroke', active ? (Math.abs(c)<=5?'var(--ok)':'var(--ink)') : 'var(--ink)');
  }

  // ---------- Staff ----------
  const staff=$('staff');
  const GAP=14, BOTTOM=128; // E4 line
  const yOf=step=>BOTTOM - step*GAP/2;
  function drawStaff(current){
    staff.innerHTML='';
    const s=(t,a)=>el(t,a,staff);
    for(let i=0;i<5;i++) s('line',{x1:6,x2:354,y1:BOTTOM-i*GAP,y2:BOTTOM-i*GAP,stroke:'var(--staff)','stroke-width':1.2});
    const clef=s('text',{x:10,y:yOf(2),'font-size':GAP*4,fill:'var(--staff)','font-family':'"Noto Music","Bravura","Segoe UI Symbol",serif'});
    clef.textContent='𝄞';
    const items=history.slice(-7).map(h=>({m:h,cur:false}));
    if(current!==null) items.push({m:current,cur:true});
    const n=items.length;
    items.forEach((it,i)=>{
      const x = current!==null ? 318 - (n-1-i)*36 : 318 - (n-1-i)*36;
      const sp=spell(it.m, scale.flats);
      const step=sp.dia-30; // 30 = E4
      const y=yOf(step);
      const age=n-1-i;
      const op = it.cur?1:Math.max(.18, .75-age*.09);
      const col = inScale(it.m)?'var(--ok)':'var(--off)';
      const g=s('g',{opacity:op});
      const L=(yy)=>el('line',{x1:x-13,x2:x+13,y1:yy,y2:yy,stroke:'var(--staff)','stroke-width':1.2},g);
      for(let k=-2;k>=step;k-=2) L(yOf(k));
      for(let k=10;k<=step;k+=2) L(yOf(k));
      el('ellipse',{cx:x,cy:y,rx:7.6,ry:5.6,fill:it.cur?col:'var(--staff)',transform:`rotate(-20 ${x} ${y})`},g);
      if(sp.acc){const t=el('text',{x:x-18,y:y+6,'text-anchor':'middle','font-size':17,fill:it.cur?col:'var(--staff)'},g);t.textContent=ACC[sp.acc];}
      if(it.cur){const t=el('text',{x,y:182,'text-anchor':'middle','font-size':12,fill:'var(--muted)'},g);t.textContent=sp.letter+ACC[sp.acc]+sp.oct+'  '+solfa(sp);}
    });
  }
  drawStaff(null);

  // ---------- Pitch detection (YIN) ----------
  function yin(buf, sr){
    const W=1024;
    const maxT=Math.min(Math.floor(sr/170), buf.length-W-1);
    const minT=Math.floor(sr/3200);
    const d=new Float32Array(maxT+2);
    for(let t=1;t<=maxT+1;t++){
      let s=0;
      for(let j=0;j<W;j++){const v=buf[j]-buf[j+t]; s+=v*v;}
      d[t]=s;
    }
    let run=0; const c=new Float32Array(maxT+2); c[0]=1;
    for(let t=1;t<=maxT+1;t++){run+=d[t]; c[t]=run? d[t]*t/run : 1;}
    let tau=-1;
    for(let t=Math.max(2,minT);t<=maxT;t++){
      if(c[t]<0.15){ while(t+1<=maxT && c[t+1]<c[t]) t++; tau=t; break; }
    }
    if(tau<0) return null;
    const x0=c[tau-1], x1=c[tau], x2=c[tau+1];
    const den=2*(2*x1-x2-x0);
    const better = den ? tau + (x2-x0)/den : tau;
    return {f: sr/better, conf: 1-x1};
  }

  // ---------- Audio ----------
  let ctx=null, analyser=null, stream=null, buf=null, running=false, raf=0;
  const recent=[];
  let peakRms=0, prevRms=0;
  const holdChk=document.getElementById('holdChk');

  async function start(){
    err.style.display='none';
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      showErr('เบราว์เซอร์นี้ใช้ไมโครโฟนไม่ได้ ลองเปิดหน้านี้ใน Chrome บนมือถือ'); return;
    }
    try{
      stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    }catch(e){
      showErr(e && e.name==='NotAllowedError'
        ? 'ไม่ได้รับอนุญาตให้ใช้ไมโครโฟน กดไอคอนแม่กุญแจที่แถบที่อยู่เว็บ อนุญาตไมโครโฟน แล้วกดเริ่มใหม่'
        : 'เปิดไมโครโฟนไม่ได้ ('+(e&&e.name||'ไม่ทราบสาเหตุ')+') ลองเปิดหน้านี้ในแท็บใหม่ของเบราว์เซอร์');
      return;
    }
    ctx = ctx || new (window.AudioContext||window.webkitAudioContext)();
    await ctx.resume();
    const src=ctx.createMediaStreamSource(stream);
    analyser=ctx.createAnalyser(); analyser.fftSize=2048;
    src.connect(analyser);
    buf=new Float32Array(analyser.fftSize);
    running=true;
    startBtn.textContent='หยุดฟัง'; startBtn.classList.add('running');
    meta.textContent='กำลังฟัง…';
    loop();
  }
  function stop(){
    running=false; cancelAnimationFrame(raf);
    if(stream) stream.getTracks().forEach(t=>t.stop());
    stream=null;
    startBtn.textContent='เริ่มฟังเสียง'; startBtn.classList.remove('running');
    showIdle(); meta.textContent='หยุดฟังแล้ว';
  }
  function showErr(msg){err.textContent=msg; err.style.display='block';}
  startBtn.onclick=()=> running?stop():start();

  function median(a){const s=[...a].sort((x,y)=>x-y);return s[Math.floor(s.length/2)];}

  function showIdle(){
    noteName.classList.add('idle'); solfaEl.classList.add('idle');
    status.textContent=''; status.className='status';
    setNeedle(shownCents,false);
    document.querySelectorAll('.strings button').forEach(b=>b.classList.remove('hit'));
    document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
  }

  function loop(){
    if(!running) return;
    analyser.getFloatTimeDomainData(buf);
    let rms=0; for(let i=0;i<buf.length;i++) rms+=buf[i]*buf[i];
    rms=Math.sqrt(rms/buf.length);
    const now=performance.now();
    let f=null;
    if(rms>0.006){
      const r=yin(buf, ctx.sampleRate);
      if(r && r.conf>0.8 && r.f>170 && r.f<3200) f=r.f;
    }
    if(f){
      lastHeard=now;
      const jump = recent.length ? Math.abs(12*Math.log2(f/median(recent))) : 99;
      let accept=true;
      if(holdChk.checked){
        // Peak hold: only trust frames near the loudest part of the note.
        const onset = rms > prevRms*1.35 && rms > 0.5*peakRms;       // new bow stroke
        const newNote = jump>0.6 && rms >= prevRms*0.97 && rms >= 0.3*peakRms; // pitch change that isn't a fading tail
        if(onset || newNote || rms>peakRms){ if(onset||newNote) recent.length=0; peakRms=rms; }
        const fading = rms < prevRms*0.97 && jump > 0.15 && !(onset||newNote); // volume dropping and pitch sliding
        if(rms < 0.75*peakRms || fading) accept=false;                         // decaying tail: keep last reading
        else peakRms*=0.985;                                         // let peak follow a softer sustained bow
      }else if(jump>0.8){ recent.length=0; }
      if(accept){
        recent.push(f); if(recent.length>5) recent.shift();
        render(median(recent), now);
      }
    }else if(now-lastHeard>450){
      recent.length=0; peakRms=0; showIdle();
      if(now-lastHeard>900){ cand=null; lastPushed=null; }
    }
    prevRms=rms;
    raf=requestAnimationFrame(loop);
  }

  function render(f, now){
    const mf=freqToMidiF(f);
    noteName.classList.remove('idle');
    if(mode==='tune'){
      let idx=selString;
      if(idx<0){ let best=1e9; STRINGS.forEach((s,i)=>{const d=Math.abs(mf-s.m); if(d<best){best=d;idx=i;}}); }
      const s=STRINGS[idx], target=midiToFreq(s.m);
      const cents=1200*Math.log2(f/target);
      noteName.innerHTML=s.n+'<sub>'+(Math.floor(s.m/12)-1)+'</sub>';
      meta.textContent=f.toFixed(1)+' Hz  (เป้าหมาย '+target.toFixed(1)+' Hz)';
      setNeedle(cents,true);
      document.querySelectorAll('.strings button').forEach(b=>b.classList.toggle('hit', +b.dataset.idx===idx));
      if(Math.abs(cents)>200){ status.textContent='เสียงห่างจากสาย '+s.n+' มาก'; status.className='status off'; }
      else if(Math.abs(cents)<=5){ status.textContent='ตรงแล้ว'; status.className='status ok'; }
      else if(cents<0){ status.textContent='ต่ำไป '+Math.round(-cents)+' cents · ขันสายให้ตึงขึ้น'; status.className='status off'; }
      else { status.textContent='สูงไป '+Math.round(cents)+' cents · คลายสายลง'; status.className='status off'; }
    }else{
      const m=Math.round(mf), cents=(mf-m)*100;
      const sp=spell(m, scale.flats);
      noteName.innerHTML=sp.letter+ACC[sp.acc]+'<sub>'+sp.oct+'</sub>';
      solfaEl.textContent=solfa(sp); solfaEl.classList.remove('idle');
      meta.textContent=f.toFixed(1)+' Hz  ·  '+(cents>=0?'+':'')+Math.round(cents)+' cents';
      setNeedle(cents,true);
      const ok=inScale(m);
      if(!ok){ status.textContent='โน้ตนี้ไม่อยู่ใน '+scale.name; status.className='status off'; }
      else if(Math.abs(cents)<=10){ status.textContent='เสียงตรง'; status.className='status ok'; }
      else { status.textContent=cents<0?'เพี้ยนต่ำ ขยับนิ้วขึ้นเล็กน้อย':'เพี้ยนสูง ขยับนิ้วลงเล็กน้อย'; status.className='status off'; }
      document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on', +c.dataset.pc===pc(m)));
      // stable-note history
      if(cand!==m){cand=m; candSince=now;}
      else if(now-candSince>150 && lastPushed!==m){ history.push(m); if(history.length>12) history.shift(); lastPushed=m; }
      drawStaff(null);
      // redraw with current (history's last may equal current; show it as current)
      const h=history.slice(); if(h.length && h[h.length-1]===m) h.pop();
      const save=history; history=h; drawStaff(m); history=save;
    }
  }

  // ---------- Reference tone ----------
  $('playRef').onclick=async()=>{
    ctx = ctx || new (window.AudioContext||window.webkitAudioContext)();
    await ctx.resume();
    const idx = selString<0 ? 2 : selString;
    const f=midiToFreq(STRINGS[idx].m);
    const o=ctx.createOscillator(), lp=ctx.createBiquadFilter(), g=ctx.createGain();
    o.type='sawtooth'; o.frequency.value=f;
    lp.type='lowpass'; lp.frequency.value=f*4;
    const t=ctx.currentTime;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.18,t+0.08);
    g.gain.setValueAtTime(0.18,t+1.6); g.gain.linearRampToValueAtTime(0,t+2);
    o.connect(lp).connect(g).connect(ctx.destination);
    o.start(t); o.stop(t+2.05);
    $('refHint').textContent='กำลังเล่นเสียงสาย '+STRINGS[idx].n+' ('+f.toFixed(1)+' Hz)';
    setTimeout(()=>{$('refHint').textContent='สายที่เลือก: '+(selString<0?'อัตโนมัติ':'สาย '+STRINGS[selString].n);},2100);
  };
})();
</script>
